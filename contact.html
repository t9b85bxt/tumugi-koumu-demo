<!doctype html>
<html lang="ja" data-page="contact">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (window.history && 'scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>
<title>お問い合わせ | つむぎ工務店</title>
<meta name="description" content="つむぎ工務店へのお問い合わせ・無料相談のご予約はこちらから(デモサイト)。">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css?v=10">
<link rel="stylesheet" href="css/animation.css?v=5">
<noscript><link rel="stylesheet" href="css/noscript.css?v=5"></noscript>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
<div class="page-transition-overlay" aria-hidden="true"></div>
<header class="site-header" data-slot="header"></header>

<main id="main">
  <nav class="breadcrumb container" aria-label="パンくずリスト">
    <ol><li><a href="index.html">Home</a></li><li aria-current="page">お問い合わせ</li></ol>
  </nav>

  <section class="page-hero">
    <div class="container">
      <p class="page-hero__label">CONTACT</p>
      <h1>お問い合わせ</h1>
      <p class="lead">無料相談・資料請求のご予約はこちらのフォームから承っております。担当より2営業日以内にご連絡いたします。</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="split" style="align-items:flex-start">
        <div>
          <form id="contact-form" novalidate>
            <div class="form-row">
              <label for="name-field">お名前<span class="required">必須</span></label>
              <input class="field" type="text" id="name-field" name="name" required autocomplete="name">
              <p class="field-error" id="name-field-error" role="alert"></p>
            </div>

            <div class="form-row form-row--split">
              <div>
                <label for="kana-field">フリガナ</label>
                <input class="field" type="text" id="kana-field" name="kana" autocomplete="off">
              </div>
              <div>
                <label for="tel-field">電話番号</label>
                <input class="field" type="tel" id="tel-field" name="tel" autocomplete="tel">
              </div>
            </div>

            <div class="form-row">
              <label for="email-field">メールアドレス<span class="required">必須</span></label>
              <input class="field" type="email" id="email-field" name="email" required autocomplete="email">
              <p class="field-error" id="email-field-error" role="alert"></p>
            </div>

            <div class="form-row">
              <fieldset>
                <legend>ご希望の相談内容</legend>
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="interest" value="new">新築</label>
                  <label class="checkbox-item"><input type="checkbox" name="interest" value="reform">リフォーム</label>
                  <label class="checkbox-item"><input type="checkbox" name="interest" value="document">資料請求</label>
                  <label class="checkbox-item"><input type="checkbox" name="interest" value="other">その他</label>
                </div>
              </fieldset>
            </div>

            <div class="form-row">
              <label for="message-field">お問い合わせ内容<span class="required">必須</span></label>
              <textarea class="field" id="message-field" name="message" required></textarea>
              <p class="field-error" id="message-field-error" role="alert"></p>
            </div>

            <div class="form-row">
              <label class="checkbox-item" for="privacy-field">
                <input type="checkbox" id="privacy-field" name="privacy" required>
                <a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する<span class="required">必須</span>
              </label>
              <p class="field-error" id="privacy-field-error" role="alert"></p>
            </div>

            <button class="btn btn--primary" type="submit">
              送信する
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>

          <div id="form-success" class="form-success" tabindex="-1" aria-live="polite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
            <h2>お問い合わせありがとうございました</h2>
            <p class="lead">担当より2営業日以内にご連絡いたします(本サイトはデモのため実際の送信は行われません)。</p>
            <a class="link-more" style="margin-top:20px;display:inline-flex" href="index.html">トップページへ戻る
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>

        <div>
          <div class="card" style="padding:28px;margin-bottom:24px">
            <h3 class="card__title">お電話でのお問い合わせ</h3>
            <p class="card__text" style="font-family:var(--font-heading);font-size:1.6rem;color:var(--color-accent);margin:10px 0">0120-123-456</p>
            <p class="card__text">受付時間 9:00〜18:00(水曜定休)</p>
          </div>
          <table class="info-table">
            <tbody>
              <tr><th>所在地</th><td>〒000-0000<br>架空県つむぎ市緑町1-2-3</td></tr>
              <tr><th>アクセス</th><td>つむぎ駅 徒歩8分 / 駐車場5台</td></tr>
            </tbody>
          </table>
          <div style="border-radius:var(--radius-card);overflow:hidden;aspect-ratio:4/3;margin-top:16px">
            <iframe src="https://maps.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%A7%85&t=&z=13&ie=UTF8&iwloc=&output=embed"
              width="100%" height="100%" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
              title="つむぎ工務店 周辺地図(イメージ)"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" data-slot="footer"></footer>

<script src="js/include.js?v=5" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
<script src="js/main.js?v=5" defer></script>
<script src="js/animation.js?v=7" defer></script>
<script src="js/transition.js?v=5" defer></script>
<script src="js/contact-form.js?v=5" defer></script>
</body>
</html>
